<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wine Cellar · สต็อกไวน์</title>
    <style>
      /* หน้าโหลดตอนเปิดเว็บ (ก่อน React เริ่ม) — React render ทับ #root แล้วหายไปเอง */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f2ef;
        color: #7a1f3d;
        font-family: system-ui, sans-serif;
        animation: boot-in 0.4s ease-out 0.15s both;
      }
      .boot svg {
        width: 44px;
        height: 58px;
      }
      .boot p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #8a7f7b;
      }
      .boot .lv {
        animation: boot-level 2.6s ease-in-out infinite;
      }
      .boot .wv {
        animation: boot-wave 1.1s linear infinite;
      }
      .boot .wv2 {
        animation-duration: 1.7s;
        animation-direction: reverse;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-level {
        0%,
        100% {
          transform: translateY(2px);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      @keyframes boot-wave {
        to {
          transform: translateX(24px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot,
        .boot .lv,
        .boot .wv {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="กำลังโหลด">
        <svg viewBox="0 0 48 64" aria-hidden="true">
          <defs>
            <clipPath id="boot-bowl"><path d="M9 6h30c0 14-3 25-15 27C12 31 9 20 9 6z" /></clipPath>
          </defs>
          <g clip-path="url(#boot-bowl)">
            <g class="lv">
              <path class="wv" d="M-48 20q6-3 12 0t12 0 12 0 12 0 12 0 12 0 12 0 12 0V40H-48z" fill="#8c2c4b" />
              <path class="wv wv2" d="M-48 21q6 3 12 0t12 0 12 0 12 0 12 0 12 0 12 0 12 0V40H-48z" fill="#631a33" opacity="0.55" />
            </g>
          </g>
          <path d="M9 6h30c0 14-3 25-15 27C12 31 9 20 9 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <path d="M24 33v20M15 57h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M14 10c0 6 1 11 4 15" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <p>WINE CELLAR</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
